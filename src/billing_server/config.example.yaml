# fengshen-desubber 在线去字幕计费服务端配置示例
# 启动：server /path/to/config.yaml（Docker 内默认 /etc/desubber/config.yaml，env CONFIG 覆盖）

listen: ":18080"        # HTTP 监听地址
src_dir: "./data/src"   # 源视频暂存目录
result_dir: "./data/result" # 结果视频目录
admin_token: "change-me-admin-token" # 管理员 token，启动时确保对应 admin 用户存在
card_pepper: "change-me-card-pepper" # 卡哈希 HMAC 密钥（env CARD_PEPPER 优先）

# DynamoDB（redimo 单表）由环境变量配置：
#   DDB_ENDPOINT  非空走本地/自建端点（如 http://localhost:18000），空走 AWS
#   TABLE_REDIMO  表名，缺省 fengshen-desubber
#   AWS_REGION    缺省 us-east-1

# TOS 对象存储（默认平台 las 的上传侧）
tos:
  ak: ""
  sk: ""
  endpoint: "tos-cn-beijing.volces.com"
  region: "cn-beijing"
  bucket: "your-bucket"

# 火山 LAS 算子（默认平台 las 的算子侧）
las:
  base_url: "https://operator.las.cn-beijing.volces.com"
  api_key: ""
  operator_id: "las_subtitle_erase"
  operator_version: "v1"
