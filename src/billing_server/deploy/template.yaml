# billing_server SAM 模板(移植自 fengshen-slicer deploy/template.yaml):
#   Lambda provided.al2023 arm64(cmd/lambda 编译的 bootstrap)+ Lambda Function URL(公网 HTTPS,CORS *)
#   + 既有 DynamoDB 单表 redimo(redimo/v2 Redis-API 单表存储,pk(B)+sk(B),TTL on exp)
#   + 最小 IAM。仅创建 Lambda,不创建/管理 redimo 表。全球账号(ap-east-1 香港)。
#   业务键统一使用 fengshen-desubber: 前缀,不迁移旧专用表数据。
#   密钥走 Parameters(NoEcho),真值存同区 SSM SecureString(/fengshen-desubber/*),不进 git。
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 峰神·去字幕计费与鉴权平台 billing_server(fengshen-desubber)

Parameters:
  AdminRootPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: 超级管理员 root 的初始密码(冷启动幂等种入;首次登录后请尽快改密)
  SessionKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: 会话令牌 HMAC 签名密钥(泄露=可伪造会话,轮换会使全部会话失效)
  CardPepper:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: 卡密 HMAC 胡椒(泄露=可伪造卡密;轮换使全部未核销卡失效)
  TosAK:
    Type: String
    NoEcho: true
    Description: 火山 TOS Access Key(las 平台上传侧;真值存 SSM /fengshen-desubber/tos-ak)
  TosSK:
    Type: String
    NoEcho: true
    Description: 火山 TOS Secret Key(真值存 SSM /fengshen-desubber/tos-sk)
  LasAPIKey:
    Type: String
    NoEcho: true
    Description: 火山 LAS 算子 API Key(真值存 SSM /fengshen-desubber/las-api-key)
  AdminWebOrigin:
    Type: String
    Default: '*'
    Description: 管理端 Web 托管源(CORS AllowOrigins;未定托管先 *)

Resources:
  DesubServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fengshen-desubber
      Description: fengshen-desubber-billing-server
      Runtime: provided.al2023
      Architectures: [ arm64 ]
      Handler: bootstrap
      CodeUri: ../dist/function.zip   # 交叉编译 cmd/lambda → bootstrap 后打成 function.zip(仅含 bootstrap)
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          TABLE_REDIMO: redimo
          CARD_PEPPER: !Ref CardPepper
          SESSION_KEY: !Ref SessionKey
          ADMIN_ROOT_PASSWORD: !Ref AdminRootPassword
          # las 平台(火山 TOS+LAS):双机密非空即注册,任务由客户端轮询推进并按 LAS 权威时长结算
          TOS_ENDPOINT: tos-cn-beijing.volces.com
          TOS_REGION: cn-beijing
          TOS_BUCKET: jy-subtitle-20260908
          TOS_AK: !Ref TosAK
          TOS_SK: !Ref TosSK
          LAS_BASE_URL: https://operator.las.cn-beijing.volces.com
          LAS_API_KEY: !Ref LasAPIKey
          LAS_OPERATOR_ID: las_subtitle_erase
          LAS_OPERATOR_VERSION: v1
      # 仅用 Lambda Function URL 暴露公网 HTTPS;AuthType NONE = 应用层自行鉴权(admin 会话/卡密信封)。
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AdminWebOrigin
          AllowMethods:
            - '*'
          AllowHeaders:
            - '*'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: redimo
        # DynamoDBCrudPolicy 模板不含 TransactWriteItems,单独补
        - Statement:
            - Sid: RedimoTransactWrite
              Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/redimo

Outputs:
  FunctionUrl:
    Description: billing_server Lambda Function URL 入口(客户端注入 baseUrl;形如 https://<id>.lambda-url.ap-east-1.on.aws/)
    Value: !GetAtt DesubServerFunctionUrl.FunctionUrl
